# ############################################################################
# 애플리케이션 설정
# ############################################################################

spring.application.name=a-stock-simulator
server.forward-headers-strategy=native

# ============================================================================
# DataSource — 일단 H2 인메모리로 시작한다
# ============================================================================
# mem:stockdb  = 메모리에만 존재하는 DB. 앱을 끄면 데이터가 전부 사라진다.
#                설치할 것이 없어서 clone 하자마자 바로 실행된다는 게 장점이다.
# DB_CLOSE_DELAY=-1
#                커넥션이 하나도 없어도 DB 를 닫지 않는다.
#                이게 없으면 테스트 중간에 DB 가 통째로 사라져서
#                "테이블이 없다" 는 황당한 에러가 난다.
spring.datasource.url=jdbc:mysql://toydb.metionlabs.com:47329/spring-data-jpas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=toy
spring.datasource.password=AlRyU8gfKTfGsF8eIQ60qzBYJ8i8kSjO
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================================
# JPA / Hibernate
# ============================================================================
# ddl-auto — 엔티티를 보고 테이블을 자동 생성할지
#   none / validate / update / create / create-drop
#
# 지금은 H2 인메모리라 매번 새로 만들어야 하므로 update 를 쓴다.
#
# ⛔ 운영 환경에서는 절대 update 이상을 쓰지 않는다.
#    create 계열은 말 그대로 운영 데이터를 날린다. update 도 위험하다 —
#    어떤 SQL 이 나갈지 예측할 수 없고 되돌릴 방법이 없다.
#    실무에서는 validate 로 두고 Flyway/Liquibase 로 스키마를 버전 관리한다.
spring.jpa.hibernate.ddl-auto=none

# 실행되는 SQL 을 눈으로 본다. JPA 를 배울 때 이게 없으면
# 쿼리가 몇 번 나가는지(N+1 등) 알 방법이 없다.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# open-in-view — 기본값 true 인데 부트도 끄라고 경고를 띄운다.
#   true  : HTTP 응답이 끝날 때까지 DB 커넥션을 붙잡는다.
#           트래픽이 몰리면 커넥션 풀이 바닥나고, DB 는 멀쩡한데 앱이 멈춘다.
#   false : 트랜잭션이 끝나면 즉시 반납. 대신 트랜잭션 밖에서 LAZY 필드를
#           건드리면 예외가 난다 — 이게 오히려 좋다.
#           "트랜잭션 안에서 DTO 로 변환해라" 는 규율을 강제해준다.
spring.jpa.open-in-view=false


# ============================================================================
# Actuator
# ============================================================================
# health 에 DB 연결 상태가 포함된다.
# 앱만 살아있고 DB 는 끊긴 상태를 잡아낼 수 있다.
management.endpoints.web.exposure.include=health,info
# [운영 주의] 내부 구성이 노출되므로 운영에서는 never 로 둔다.
management.endpoint.health.show-details=always
