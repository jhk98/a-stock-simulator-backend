# ############################################################################
# 애플리케이션 설정
# ############################################################################

# 애플리케이션 이름
spring.application.name=a-stock-simulator

# Nginx 등 리버스 프록시가 전달하는 Forwarded 헤더 처리
server.forward-headers-strategy=native


# ============================================================================
# DataSource
# ============================================================================

# MySQL 연결 정보
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================================
# JPA / Hibernate
# ============================================================================

# Hibernate가 DB 테이블을 자동으로 생성하거나 변경하지 않도록 설정
spring.jpa.hibernate.ddl-auto=none

# 실행되는 SQL 출력
spring.jpa.show-sql=true

# SQL 출력 형식 정리
spring.jpa.properties.hibernate.format_sql=true

# 영속성 컨텍스트를 웹 요청 전체에 걸쳐 유지하지 않음
spring.jpa.open-in-view=false


# ============================================================================
# Actuator
# ============================================================================

# 외부에 노출할 Actuator 엔드포인트
management.endpoints.web.exposure.include=health,info

# Health 엔드포인트 상세 정보 표시
# 운영 환경에서는 민감한 상태 정보 노출을 방지하도록 조정 필요
management.endpoint.health.show-details=always


# ============================================================================
# Redis
# ============================================================================

# Redis 서버 연결 정보
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# ============================================================================
# AES Encryption
# ============================================================================

# 주민등록번호 암호화 및 복호화에 사용할 AES-256 비밀키
#
# MEMBER_AES_KEY는 Base64로 인코딩된 32바이트 키
# 기존 암호문을 복호화해야 하므로 키 변경에 주의
encryption.aes.key=${MEMBER_AES_KEY}


# ============================================================================
# JWT Authentication
# ============================================================================

# JWT 서명 및 검증에 사용할 비밀키
#
# JWT_SECRET_KEY 환경변수에서 값을 가져온다.
# 현재 JwtTokenProvider 구현에서는 UTF-8 문자열로 해석한다.
# 최소 32바이트 이상의 예측하기 어려운 랜덤 키를 사용한다.
#
# AES 키와 JWT 키는 별도로 관리한다.
jwt.secret=${JWT_SECRET_KEY}


# ============================================================================
# Kiwoom REST API
# ============================================================================

# 키움증권 REST API 기본 주소
kiwoom.api.base-url=https://api.kiwoom.com

# 키움증권 API 인증 정보
kiwoom.api.app-key=${KIWOOM_APP_KEY}
kiwoom.api.secret-key=${KIWOOM_SECRET_KEY}


# ============================================================================
# CORS
# ============================================================================

# React 프론트엔드에서 접근을 허용할 Origin 목록
#
# CORS_ALLOWED_ORIGINS 환경변수가 없으면 기본값을 사용한다.
# 여러 Origin은 쉼표로 구분한다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://43.200.165.16}
