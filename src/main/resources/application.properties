# ############################################################################
# 애플리케이션 설정
# ############################################################################

spring.application.name=a-stock-simulator
server.forward-headers-strategy=native

# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# AES Encryption
encryption.aes.key=${MEMBER_AES_KEY}

# Kiwoom REST API
kiwoom.api.base-url=https://api.kiwoom.com
kiwoom.api.app-key=${KIWOOM_APP_KEY}
kiwoom.api.secret-key=${KIWOOM_SECRET_KEY}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://43.200.165.16}