# ############################################################################
# 애플리케이션 설정
# ############################################################################

# 애플리케이션 이름
spring.application.name=a-stock-simulator

# Nginx 등 리버스 프록시가 전달하는 Forwarded 헤더 처리
server.forward-headers-strategy=native


# ============================================================================
# DataSource
# ============================================================================

# MySQL 연결 정보
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================================
# JPA / Hibernate
# ============================================================================

# Hibernate가 DB 테이블을 자동으로 생성하거나 변경하지 않도록 설정
spring.jpa.hibernate.ddl-auto=none

# 실행되는 SQL 출력
spring.jpa.show-sql=true

# SQL 출력 형식 정리
spring.jpa.properties.hibernate.format_sql=true

# 영속성 컨텍스트를 웹 요청 전체에 걸쳐 유지하지 않음
spring.jpa.open-in-view=false


# ============================================================================
# Actuator
# ============================================================================

# 외부에 노출할 Actuator 엔드포인트
management.endpoints.web.exposure.include=health,info

# Health 엔드포인트 상세 정보 표시
# 운영 환경에서는 민감한 상태 정보 노출을 방지하도록 조정 필요
management.endpoint.health.show-details=always


# ============================================================================
# Redis
# ============================================================================

# Redis 서버 연결 정보
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}


# ============================================================================
# JWT Authentication
# ============================================================================

# JWT 서명 및 검증에 사용할 비밀키
#
# JWT_SECRET_KEY 환경변수에서 값을 가져온다.
jwt.secret=${JWT_SECRET_KEY}

# Access Token 유효기간
# 900초 = 15분
jwt.access-expiration-seconds=900

# Refresh Token 유효기간
# 604800초 = 7일
jwt.refresh-expiration-seconds=604800

# ============================================================================
# Authentication Cookie
# ============================================================================

# Refresh Token을 저장하는 HttpOnly 쿠키의 Secure 속성
#
# true:
#   HTTPS 연결에서만 쿠키를 전송한다.
#   운영 환경에서 사용한다.
#
# false:
#   HTTP 환경에서도 쿠키를 전송할 수 있다.
#   HTTPS가 없는 개발 환경에서 사용한다.
#
# Auth_COOKIE_SECURE 환경변수로 환경별 설정을 분리한다.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# ============================================================================
# Kiwoom REST API
# ============================================================================

# 키움증권 REST API 기본 주소
kiwoom.api.base-url=https://api.kiwoom.com

# 키움증권 API 인증 정보
kiwoom.api.app-key=${KIWOOM_APP_KEY}
kiwoom.api.secret-key=${KIWOOM_SECRET_KEY}


# ============================================================================
# CORS
# ============================================================================

# React 프론트엔드에서 접근을 허용할 Origin 목록
#
# CORS_ALLOWED_ORIGINS 환경변수가 없으면 기본값을 사용한다.
# 여러 Origin은 쉼표로 구분한다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://43.200.165.16}


# ============================================================================
# Email Authentication - Gmail SMTP
# ============================================================================

# 이메일 발송 서버
spring.mail.host=smtp.gmail.com

# Gmail SMTP 포트
spring.mail.port=587

# 발신자 Gmail 계정
spring.mail.username=${MAIL_USERNAME}

# Gmail 앱 비밀번호
spring.mail.password=${MAIL_APP_PASSWORD}

# SMTP 인증 사용
spring.mail.properties.mail.smtp.auth=true

# TLS 암호화 연결 사용
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SMTP 연결 타임아웃 (5초)
spring.mail.properties.mail.smtp.connectiontimeout=5000

# SMTP 응답 타임아웃 (5초)
spring.mail.properties.mail.smtp.timeout=5000

# SMTP 데이터 전송 타임아웃 (5초)
spring.mail.properties.mail.smtp.writetimeout=5000


# ============================================================================
# Email Verification
# ============================================================================

# 이메일 인증번호 HMAC-SHA256 비밀키
# EMAIL_VERIFICATION_SECRET 환경변수로 관리
app.email.verification-secret=${EMAIL_VERIFICATION_SECRET}