// ############################################################################
// Gradle 빌드 스크립트 (Groovy DSL)
// ----------------------------------------------------------------------------
// Spring Boot 4.1.0 + Java 25 (LTS) 기준.
//
// 이 파일은 프로젝트를 빌드할 때 필요한 플러그인, Java 버전, 외부 라이브러리(의존성), 테스트 설정 등을 정의한다.
//
// ############################################################################


// ============================================================================
// 1. 플러그인 설정
// ============================================================================

plugins {
    /**
     * Java 프로젝트임을 Gradle에 알려준다.
     *
     * Java 소스 코드 컴파일, 테스트 실행, JAR 생성 등 Java 프로젝트에 필요한 기본적인 Gradle 작업(Task)을 사용할 수 있게 된다.
     */
    id 'java'

    /**
     * Spring Boot 프로젝트를 빌드하고 실행하기 위한 Gradle 플러그인
     *
     * bootRun, bootJar 등의 Spring Boot 전용 Task를 사용할 수 있게 된다.
     */
    id 'org.springframework.boot' version '4.1.0'


    /**
     * Spring에서 관리하는 라이브러리 버전을 적용하기 위한 플러그인
     *
     * Spring Boot가 호환되는 라이브러리 버전을 관리해주기 때문에 dependencies에서 대부분의 라이브러리 버전을 직접 작성하지 않아도 된다.
     */
    id 'io.spring.dependency-management' version '1.1.7'
}


// ============================================================================
// 2. 프로젝트 기본 정보
// ============================================================================

/**
 * 프로젝트의 그룹
 *
 * 일반적으로 Java 패키지의 최상위 이름과 비슷하게 사용한다.
 */
group = 'com.myproject'

/**
 * 현재 프로젝트 버전
 *
 * SNAPSHOT은 아직 정식 배포 버전이 아닌 개발 중인 버전이라는 의미로 많이 사용한다.
 */
version = '0.0.1-SNAPSHOT'

/**
 * 프로젝트에 대한 설명
 */
description = '모의 주식 시뮬레이터'


// ============================================================================
// 3. Java 버전 설정
// ============================================================================

java {
    /**
     * Java Toolchain을 이용하여 이 프로젝트에서 사용할 Java 버전을 지정한다.
     *
     * 개발자마다 설치되어 있는 Java 버전이 달라도 프로젝트에서는 Java 25를 기준으로 빌드하도록 설정한다.
     */
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


// ============================================================================
// 4. Repository 설정
// ============================================================================

/**
 * dependencies에 작성한 외부 라이브러리를 어디에서 다운로드할 것인지 지정한다.
 */

repositories {

    /**
     * Maven Central Repository를 사용한다.
     *
     * Spring, Lombok, MySQL Driver 등 대부분의 Java 라이브러리를 Maven Central에서 다운로드할 수 있다.
     */
    mavenCentral()
}


// ============================================================================
// 5. 프로젝트 의존성
// ============================================================================
dependencies {

    // ------------------------------------------------------------------------
    // Web / REST API
    // ------------------------------------------------------------------------

    /**
     * Spring MVC 기반 웹 애플리케이션을 만들기 위한 Starter.
     *
     * Controller를 이용한 HTTP 요청/응답 처리, REST API 구성, JSON 변환 등의 웹 기능을 사용할 수 있게 해준다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'


    // ------------------------------------------------------------------------
    // DB 접근 - Spring Data JPA
    // ------------------------------------------------------------------------

    /**
     * Spring Data JPA를 사용하기 위한 Starter.
     *
     * JpaRepository를 이용한 Repository 구현, Entity와 DB 테이블의 매핑, 트랜잭션 처리 등을 사용할 수 있게 한다.
     * 내부적으로 Hibernate가 JPA 구현체로 사용된다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'


    // ------------------------------------------------------------------------
    // Validation
    // ------------------------------------------------------------------------

    /**
     * Controller로 전달되는 요청 데이터의 유효성을 검사하기 위해 사용한다.
     *
     * ex)
     * @Valid, @NotNull, @NotBlank
     *
     * DTO에 검증 어노테이션을 작성할 때 필요한 의존성이다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-validation'


    // ------------------------------------------------------------------------
    // Actuator
    // ------------------------------------------------------------------------

    /**
     * 실행 중인 Spring Boot 애플리케이션의 상태를 확인하거나 모니터링하기 위한 기능을 제공한다.
     * 대표적으로 서버 상태를 확인하는 health endpoint 등을 사용할 수 있다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'


    // ------------------------------------------------------------------------
    // Redis
    // ------------------------------------------------------------------------

    /**
     * Redis와 데이터를 주고받기 위한 Spring Data Redis Starter
     *
     * 캐시, 세션, 임시 데이터 저장 등의 목적으로 Redis를 사용할 때 필요하다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'


    // ------------------------------------------------------------------------
    // 비밀번호 암호화
    // ------------------------------------------------------------------------

    /**
     * Spring Security 전체를 적용하는 것이 아니라 BCryptPasswordEncoder 등의 암호화 기능을 사용하기 위해 추가한 의존성
     *
     * 회원 비밀번호를 DB에 평문 그대로 저장하지 않고 BCrypt 방식으로 해시 처리할 때 사용할 수 있다.
     */
    implementation 'org.springframework.security:spring-security-crypto'


    // ------------------------------------------------------------------------
    // MySQL Driver
    // ------------------------------------------------------------------------

    /**
     * Spring Boot 애플리케이션이 MySQL과 통신하기 위해 필요한 JDBC Driver
     *
     * runtimeOnly는 애플리케이션 실행 시에는 필요하지만 Java 소스 코드를 컴파일할 때 직접 사용할 필요는 없다는 의미이다.
     * JPA/Hibernate가 최종적으로 MySQL에 SQL을 전달할 때 이 JDBC Driver를 통해 DB와 통신한다.
     */
    runtimeOnly 'com.mysql:mysql-connector-j'


    // ------------------------------------------------------------------------
    // Lombok
    // ------------------------------------------------------------------------

    /**
     * Lombok은 반복적으로 작성되는 Java 코드를 줄이기 위해 사용한다.
     *
     * ex)
     * @Getter
     * @Builder
     * @AllArgsConstructor
     * @NoArgsConstructor
     *
     * compileOnly: 컴파일할 때 Lombok을 사용하지만 실행되는 애플리케이션에 Lombok 자체를 포함할 필요는 없다.
     */
    compileOnly 'org.projectlombok:lombok:1.18.46'

    /**
     * Lombok 어노테이션을 실제 Java 코드로 처리하는 Annotation Processor를 등록한다.
     */
    annotationProcessor 'org.projectlombok:lombok:1.18.46'


    // ------------------------------------------------------------------------
    // 테스트
    // ------------------------------------------------------------------------

    /**
     * Spring MVC 관련 테스트를 위한 의존성
     *
     * Controller, MockMvc 등을 테스트할 때 사용한다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    /**
     * Spring Data JPA 관련 테스트를 위한 의존성
     *
     * Repository와 JPA 동작 등을 테스트할 때 사용한다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    /**
     * JUnit Platform에서 테스트를 실행하기 위한 런처
     */
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /**
     * 테스트 코드에서도 Lombok을 사용할 수 있도록 설정한다.
     */
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}


// ============================================================================
// 6. 테스트 설정
// ============================================================================

tasks.withType(Test).configureEach {

    /**
     * JUnit 5(JUnit Platform)를 사용하여 테스트를 실행한다.
     */
    useJUnitPlatform()
}