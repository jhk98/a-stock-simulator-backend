// ############################################################################
// Gradle 빌드 스크립트 (Groovy DSL)
// ----------------------------------------------------------------------------
// Spring Boot 4.1.0 + Java 25 (LTS) 기준
//
// 프로젝트를 빌드에 필요한 플러그인, Java 버전, 외부 라이브러리(의존성), 테스트 설정 등을 정의한다.
//
// ############################################################################


// ============================================================================
// 1. 플러그인 설정
// ============================================================================

plugins {
    /**
     * Java 프로젝트임에 필요한 Gradle 기능을 제공
     *
     * Java 컴파일, 테스트 실행, JAR 생성 등의 작업을 수행할 수 있다.
     */
    id 'java'

    /**
     * Spring Boot 프로젝트 빌드 및 실행을 위한 플러그인
     *
     * bootRun, bootJar 등의 Spring Boot 전용 Task를 제공한다.
     */
    id 'org.springframework.boot' version '4.1.0'


    /**
     * Spring에서 관리하는 의존성 버전을 적용
     *
     * 대부분의 Spring 관련 라이브러리는 버전을 직접 지정하지 않아도 호환되는 버전을 사용한다.
     */
    id 'io.spring.dependency-management' version '1.1.7'
}


// ============================================================================
// 2. 프로젝트 기본 정보
// ============================================================================

/**
 * 프로젝트의 그룹
 */
group = 'com.myproject'

/**
 * 프로젝트 버전
 */
version = '0.0.1-SNAPSHOT'

/**
 * 프로젝트 설명
 */
description = '모의 주식 시뮬레이터'


// ============================================================================
// 3. Java 버전 설정
// ============================================================================

java {
    /**
     * Java Toolchain을 사용하여 프로젝트의 Java 버전을 25로 지정
     */
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}


// ============================================================================
// 4. Repository 설정
// ============================================================================
repositories {
    /**
     * 외부 라이브러리를 다운로드할 저장소
     */
    mavenCentral()
}


// ============================================================================
// 5. 프로젝트 의존성
// ============================================================================
dependencies {

    // ------------------------------------------------------------------------
    // Web / REST API
    // ------------------------------------------------------------------------

    /**
     * Spring MVC 기반 REST API 개발을 위한 Starter
     *
     * Controller, HTTP 요청/응답 처리, JSON 변환 등을 지원한다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'


    // ------------------------------------------------------------------------
    // DB 접근 - Spring Data JPA
    // ------------------------------------------------------------------------

    /**
     * Spring Data JPA를 사용하기 위한 Starter
     *
     * JpaRepository, Entity 매핑, Hibernate등을 사용할 수 있다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'


    // ------------------------------------------------------------------------
    // Validation
    // ------------------------------------------------------------------------

    /**
     * 요청 DTO의 유효성 검증을 위한 Starter
     *
     * @Valid, @NotNull, @NotBlank, @Email 등을 사용할 수 있다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-validation'


    // ------------------------------------------------------------------------
    // Actuator
    // ------------------------------------------------------------------------

    /**
     * 애플리케이션 상태 확인 및 모니터링 기능
     *
     * /actuator/health 등의 엔드포인트를 제공한다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-actuator'


    // ------------------------------------------------------------------------
    // Redis
    // ------------------------------------------------------------------------

    /**
     * Redis 연결 및 데이터 접근을 위한 Starter
     *
     * 추후 Refresh Token 관리, 로그아웃 처리 및 토큰 만료 관리 등에 사용할 수 있다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'


    // ------------------------------------------------------------------------
    // Spring Security
    // ------------------------------------------------------------------------

    /**
     * Spring Security 인증 및 인가 기능
     *
     * SecurityFilterChain을 통한 HTTP 보안 설정, 사용자 인증 및 권한 검사,
     * PasswordEncoder를 이용한 BCrypt 해시 등을 지원한다.
     */
    implementation 'org.springframework.boot:spring-boot-starter-security'


    // ------------------------------------------------------------------------
    // JWT (JSON Web Token)
    // ------------------------------------------------------------------------

    /**
     * JWT 생성 및 검증을 위한 API
     *
     * 로그인 성공 시 Access Token 발급, JWT 서명 검증, 만료 시간 확인 등에 사용한다.
     */
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'

    /**
     * JJWT의 실체 구현체
     *
     * 실행 시 필요하므로 runtimeOnly로 선언한다.
     */
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'

    /**
     * JWT Claims를 JSON으로 변환하거나 JSON 데이터를 Claims로 읽기 위한 Jackson 연동 모듈
     */
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ------------------------------------------------------------------------
    // MySQL Driver
    // ------------------------------------------------------------------------

    /**
     * Spring Boot와 MySQL 사이의 JDBC 통신을 담당
     *
     * JPA/Hibernaterk SQL을 실행할 때 사용한다.
     */
    runtimeOnly 'com.mysql:mysql-connector-j'


    // ------------------------------------------------------------------------
    // Lombok
    // ------------------------------------------------------------------------

    /**
     * 반복적으로 Java 코드를 줄이기 위한 라이브러리
     *
     * @Getter, @Builder, @AllArgsConstructor 등을 지원한다.
     */
    compileOnly 'org.projectlombok:lombok:1.18.46'

    /**
     * Lombok 어노테이션을 컴파일 시 처리
     */
    annotationProcessor 'org.projectlombok:lombok:1.18.46'


    // ------------------------------------------------------------------------
    // 테스트
    // ------------------------------------------------------------------------

    /**
     * Spring MVC 및 Controller 테스트
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

    /**
     * Spring Data JPA 및 Repository 테스트
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'

    /**
     * Spring Security 인증 및 인가 테스트
     *
     * MockMVC를 이용한 인증 사용자 테스트, 권한 검사 및 보안 필터 테스트에 사용한다.
     */
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

    /**
     * JUnit Platform 테스트 실행 런처
     */
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    /**
     * 테스트 코드에서도 Lombok을 사용
     */
    testCompileOnly 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
}


// ============================================================================
// 6. 테스트 설정
// ============================================================================

tasks.withType(Test).configureEach {

    /**
     * JUnit 5 기반 테스트 실행
     */
    useJUnitPlatform()
}